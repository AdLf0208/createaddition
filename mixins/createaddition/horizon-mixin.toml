[mod]
id = "createaddition"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure FE network rules (standalone crate lib, injected as
# `crate::game::createaddition`): the connector rates, the wire-length and
# link rules, the network buffer and the one-tick accountancy.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "createaddition"
source = "runtime.rs"

# Game-side glue: the block entities, the wire links, the level pass and the
# commands.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "createaddition_state"
source = "support.rs"

# The content half is inside this bundle (`data/createaddition-content.hmod`,
# the built `content/createaddition.hmod`): this writes it to `.horizon-cache/`
# and appends it to the dev-mod list, so one `.hnmod` installs the blocks and the
# code. The registry keeps one file per project; AE2 ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# A connector or accumulator gets a block entity (API 15).
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, Compound)>", value = "entity" },
]

# ... and ticks on the server (API 15).
[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "ticks" },
]

# The FE buffer (API 142): `Capabilities.Energy.BLOCK`. A connector exposes its
# rate-limited window, the accumulator its 2,000,000 FE.
[[injection]]
id = "block-entity-energy"
hook = "block_entity_energy"
hook_version = 1
kind = "HEAD"
helper = "block_entity_energy.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "energy", ty = "&mut Option<ModEnergyBuffer>", value = "energy" },
]

# The block entity's own tick (API 17): it writes nothing, the transfer runs at
# level_tick_post (its own writes would be reverted).
[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut ModBlockEntity", value = "entity" },
]

# A placed connector is mounted on the face it was clicked against (API 76).
[[injection]]
id = "state-for-placement"
hook = "state_for_placement"
hook_version = 1
kind = "HEAD"
helper = "state_for_placement.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "context", ty = "&PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<BlockStateId>>", value = "answer" },
]

# A spool lays a wire between two connectors, the empty spool takes it out
# (API 13).
[[injection]]
id = "use-item-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# The FE transfer of the whole level, after its block entities ticked (API 23).
[[injection]]
id = "level-tick-post"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "level_tick_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# `/createaddition info|energy|link|unlink|mode` (API 8): the harness's readout
# and the controls the GUI/wrench would give a player.
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
